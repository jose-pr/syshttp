[build-system]
# 1.27 is the first hatchling that reads the PEP 639 license fields below.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "syshttp"
version = "0.1.0"
authors = [{ name = "jose-pr", email = "jose-pr@coqui.dev" }]
description = "HTTP plumbing that follows the system: the system proxy (PAC, WPAD) and the OS certificate verifier by default, proxy credentials and prefix gateways, Netscape cookie jars, OS trust-store TLS, URL hooks, and an HTTP client on the standard library"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
# Every floor is the newest release that still supports Python 3.9: the one
# version line tested, on every supported Python.
dependencies = [
    # The system's proxy configuration (WinHTTP, macOS, libproxy/desktops; PAC
    # and WPAD) is the default route when no proxy variable is set.
    "proxylib>=2.0.2,<3",
    # The system's TLS client: the OS verifies certificates (through
    # truststore on Python 3.10+) and a server asking for a client certificate
    # gets one from the OS store, chosen as a browser would.
    "sslcontext>=2.1.0,<3",
    # Patches requests, urllib, httpx, aiohttp and pip as they are imported, when
    # SYSHTTP_IMPORTPATCH asks for it (syshttp.autopatch, the entry points below).
    "importpatch>=0.2.1,<0.3",
]

[project.entry-points.importpatch]
requests = "syshttp.autopatch"
"urllib.request" = "syshttp.autopatch"
httpx = "syshttp.autopatch"
aiohttp = "syshttp.autopatch"
"pip._vendor.requests" = "syshttp.autopatch"

[project.optional-dependencies]
# A JavaScript engine for PAC scripts proxylib evaluates itself (Linux without
# libproxy); Windows and macOS evaluate PAC in the OS.
pac = ["proxylib[pac]>=2.0.2,<3"]
# Negotiate and NTLM authentication (syshttp.negotiate): SSPI on Windows with the
# logon session, GSSAPI where `gssapi` is installed (the `kerberos` extra), and
# NTLM in Python elsewhere.
negotiate = ["pyspnego>=0.12.0,<0.13"]
# Kerberos from the credential cache on Linux and macOS: pyspnego's GSSAPI
# support, which builds against the system's Kerberos headers (krb5-devel,
# libkrb5-dev) when no wheel exists.
kerberos = ["pyspnego[kerberos]>=0.12.0,<0.13"]
# requests, httpx and aiohttp are what syshttp.autopatch patches: the tests
# use them. syshttp's own client needs none of them.
dev = ["requests", "httpx", "aiohttp", "build", "pytest", "black", "mypy<2", "types-requests", "syshttp[negotiate]"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/jose-pr/syshttp"
Documentation = "https://jose-pr.github.io/syshttp/"
Issues = "https://github.com/jose-pr/syshttp/issues"

[tool.hatch.build.targets.sdist]
# "/.*" is dotfiles only; it does not match `*.local.*`, which needs its own
# pattern. The root AGENTS.md orients a contributor and is not shipped.
exclude = ["/.*", "*.local.*", "/AGENTS.md", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/syshttp"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "syshttp/README.md"

[tool.black]
target-version = ["py39"]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Warnings are errors. An exception is listed here as narrowly as the warning's
# own text, with the reason it is tolerated.
filterwarnings = [
    "error",
    # cryptography, the cipher library of pyspnego, says so at import when its
    # OpenSSL has no legacy provider (a Windows ARM64 Python ships none). NTLM
    # needs RC4, which lives there: the tests that need it probe for it and skip.
    "ignore:OpenSSL 3's legacy provider failed to load:Warning",
]
